[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agntia-ciberseguridad"
version = "0.1.0a1"
description = "Defensive security middleware for authorized assets and agents"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2.10,<3", "uvicorn>=0.30,<1", "jsonschema>=4.23,<5"]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1"]

[project.scripts]
agntia-ciberseguridad = "agntia_ciberseguridad.cli:main"

[tool.setuptools.packages.find]
include = ["agntia_ciberseguridad*"]

[tool.setuptools.package-data]
agntia_ciberseguridad = ["data/cyclonedx/*.json", "data/cyclonedx/*.txt"]
