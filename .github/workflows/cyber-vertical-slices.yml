name: Cyber vertical slices (synthetic, no external services)

on:
  pull_request:
    paths:
      - 'agntia_ciberseguridad/**'
      - 'tests/**'
      - 'typescript/**'
      - 'pyproject.toml'
      - '.github/workflows/cyber-vertical-slices.yml'
  push:
    branches:
      - 'fix/cyber-vs-hardening-20261122'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cyber-vertical-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install local package and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Compile all Python modules and tests
        run: python -m compileall -q agntia_ciberseguridad tests
      - name: Security and connector regressions
        run: |
          python -m unittest tests.security.test_identity_tenancy -v
          python -m unittest tests.unit.test_integration_ports tests.unit.test_host_bridge -v
      - name: Synthetic vertical slices
        run: python -m unittest tests.integration.test_cyber_vertical_slices -v
      - name: Full repository tests
        run: python -m unittest discover -s tests -v
  sdk:
    name: TypeScript SDK
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run pack:deterministic
      - run: npm run provenance:check
