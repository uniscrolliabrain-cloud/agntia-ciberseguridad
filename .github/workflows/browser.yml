name: Scoped observability browser
on: [push, pull_request]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]' playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - run: PYTHONPATH=. AGNTIA_BROWSER_EVIDENCE=browser-evidence python scripts/browser_observability.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-console-screenshots
          path: browser-evidence/
