name: Dependency audit
on: [push, pull_request]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Isolated environment with the project runtime dependencies
        run: |
          python -m venv .audit-venv
          .audit-venv/bin/python -m pip install --upgrade pip
          .audit-venv/bin/python -m pip install -e '.[dev]'
          .audit-venv/bin/python -m pip install 'pip-audit==2.10.1'
      - name: Audit installed runtime and development dependencies
        run: .audit-venv/bin/python -m pip_audit --local --progress-spinner off
      - name: Audit the project dependency set without installing it
        run: .audit-venv/bin/python -m pip_audit . --progress-spinner off
