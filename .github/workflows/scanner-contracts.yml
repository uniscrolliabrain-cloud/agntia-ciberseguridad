name: Offline scanner contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  docker-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: python scripts/prepare_scanner_images.py
      - run: python scripts/build_probe_image.py
      - run: python scripts/diagnose_trivy_fixture.py
      - name: Real sandbox and scanner contracts, synthetic fixtures only
        env:
          AGNTIA_RUN_DOCKER_TESTS: '1'
        run: python -m unittest tests.docker.test_real_scanners tests.docker.test_extended_scanners -v
      - name: Preserve image provenance without raw reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scanner-provenance
          path: |
            state/scanner-build/images.json
            state/scanner-build/probe/base.json
          if-no-files-found: warn
