name: Foundation runtime
on: [push, pull_request]
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: typescript
      - run: npm audit --omit=dev --audit-level=high --json
        working-directory: typescript
      - run: npm test
        working-directory: typescript
      - run: node -e 'console.log(JSON.stringify(require("./package-lock.json")))'
        working-directory: typescript
      - run: python -m pip install -e '.[dev]'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/export_schemas.py
      - run: git diff --exit-code -- docs/implementation/schemas
      - run: agntia-ciberseguridad --version
      - run: python scripts/check_distribution.py
      - run: PYTHONPATH=. python scripts/evaluate_agent_gateway.py
      - run: PYTHONPATH=. python scripts/measure_agent_stop.py
