name: Foundation runtime
on: [push, pull_request]
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/export_schemas.py
      - run: git diff --exit-code -- docs/implementation/schemas
      - run: agntia-ciberseguridad --version
      - run: python scripts/check_distribution.py
      - run: PYTHONPATH=. python scripts/evaluate_agent_gateway.py
