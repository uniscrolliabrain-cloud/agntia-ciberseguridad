global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yaml
scrape_configs:
  - job_name: agntia-api
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/agntia_metrics_token
    static_configs:
      - targets: [agntia-api:8012]
