[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agntia-adversarial"
version = "0.1.0"
description = "Adversarial Lab: supervised, provider-neutral security experiments on synthetic twins"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.10,<3",
  "jsonschema>=4.23,<5",
  "cryptography>=46,<51",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agntia_adversarial = ["store/migrations/*.sql"]
